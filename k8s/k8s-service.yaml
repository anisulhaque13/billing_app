apiVersion: v1
kind: Service
metadata:
  name: simplebilling-service
spec:
  selector:
    app: simplebilling
  ports:
    - name: http
      protocol: TCP
      port: 80       # External port
      targetPort: 8080  # Container port
    - name: https
      protocol: TCP
      port: 443      # External port
      targetPort: 8443  # Container port
  type: LoadBalancer
