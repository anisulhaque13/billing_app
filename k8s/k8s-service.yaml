apiVersion: v1
kind: Service
metadata:
  name: simplebilling-service
spec:
  selector:
    app: simplebilling
  ports:
    - name: http
      protocol: TCP
      port: 80       # External port for frontend
      targetPort: 80  # Container port for Angular
    - name: backend
      protocol: TCP
      port: 8081      # External port for SQL Server
      targetPort: 8081  # Container port for SQL Server
    - name: db
      protocol: TCP
      port: 1433      # External port for SQL Server
      targetPort: 1433  # Container port for SQL Server
  type: LoadBalancer
