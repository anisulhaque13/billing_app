apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplebilling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simplebilling
  template:
    metadata:
      labels:
        app: simplebilling
    spec:
      containers:
        - name: simplebilling
          image: gcr.io/projectmdanisulhaque/simplebilling:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: simplebilling-service
spec:
  type: LoadBalancer
  selector:
    app: simplebilling
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
