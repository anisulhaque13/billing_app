apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angular-app
  template:
    metadata:
      labels:
        app: angular-app
    spec:
      containers:
        - name: angular-app
          image: gcr.io/projectmdanisulhaque/angular-app:latest
          ports:
            - containerPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplebilling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simplebilling
  template:
    metadata:
      labels:
        app: simplebilling
    spec:
      containers:
        - name: simplebilling
          image: gcr.io/projectmdanisulhaque/simplebilling:latest
          ports:
            - containerPort: 8080
            - containerPort: 8081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: gcr.io/projectmdanisulhaque/db:latest
          ports:
            - containerPort: 1433

---
apiVersion: v1
kind: Service
metadata:
  name: angular-app
spec:
  selector:
    app: angular-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: simplebilling
spec:
  selector:
    app: simplebilling
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - protocol: TCP
      port: 1433
      targetPort: 1433
  type: ClusterIP
