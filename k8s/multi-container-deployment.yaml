apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-container-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-container
  template:
    metadata:
      labels:
        app: multi-container
    spec:
      containers:
      - name: angular-app
        image: gcr.io/projectmdanisulhaque/angular-app:latest  # Placeholder for Project ID
        resources:
          requests:
            cpu: "250m"  # 0.25 CPU for Angular
            memory: "512Mi"  # 512MB memory for Angular
          limits:
            cpu: "250m"  # 0.25 CPU for Angular
            memory: "512Mi"  # 512MB memory for Angular
        ports:
        - containerPort: 80  # Expose only one port for Angular

      - name: simplebilling
        image: gcr.io/projectmdanisulhaque/simplebilling:latest  # Placeholder for Project ID
        resources:
          requests:
            cpu: "250m"  # 0.25 CPU for Simple Billing
            memory: "512Mi"  # 512MB memory for Simple Billing
          limits:
            cpu: "250m"  # 0.25 CPU for Simple Billing
            memory: "512Mi"  # 512MB memory for Simple Billing
        ports:
        - containerPort: 8080  # Expose only one port for Simple Billing

      - name: sqlserver
        image: gcr.io/projectmdanisulhaque/sqlserver:latest  # Placeholder for Project ID
        resources:
          requests:
            cpu: "500m"  # 0.5 CPU for SQL Server
            memory: "2Gi"  # 2GB memory for SQL Server
          limits:
            cpu: "500m"  # 0.5 CPU for SQL Server
            memory: "2Gi"  # 2GB memory for SQL Server
        ports:
        - containerPort: 1433  # Expose only one port for SQL Server
