apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-container-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-container
  template:
    metadata:
      labels:
        app: multi-container
    spec:
      containers:
        # Angular app - exposed externally on port 8080
        - name: angular-app
          image: gcr.io/projectmdanisulhaque/angular-app:latest
          env:
            - name: PORT
              value: "8080"  # Ensure this is set correctly, or dynamically passed by Kubernetes/Cloud Run
          resources:
            requests:
              cpu: "250m"  # 0.25 CPU for Angular
              memory: "512Mi"  # 512MB memory for Angular
            limits:
              cpu: "250m"  # 0.25 CPU for Angular
              memory: "512Mi"  # 512MB memory for Angular
          ports:
            - containerPort: 8080  # Expose HTTP port for Angular

        # SimpleBilling - no external port exposed
        - name: simplebilling
          image: gcr.io/projectmdanisulhaque/simplebilling:latest
          resources:
            requests:
              cpu: "250m"  # 0.25 CPU for Simple Billing
              memory: "512Mi"  # 512MB memory for Simple Billing
            limits:
              cpu: "250m"  # 0.25 CPU for Simple Billing
              memory: "512Mi"  # 512MB memory for Simple Billing
          ports: []  # No containerPort exposed for SimpleBilling
          env:
            - name: CONNECTION_STRING
              value: "Server=sqlserver,1433;Database=BillingDB;User Id=sa;Password=123+abc-456;TrustServerCertificate=True;"

        # SQL Server - No external port exposed, only internal communication allowed
        - name: sqlserver
          image: gcr.io/projectmdanisulhaque/sqlserver:latest
          resources:
            requests:
              cpu: "500m"  # 0.5 CPU for SQL Server
              memory: "2Gi"  # 2GB memory for SQL Server
            limits:
              cpu: "500m"  # 0.5 CPU for SQL Server
              memory: "2Gi"  # 2GB memory for SQL Server
          ports: []  # No containerPort exposed for SQL Server
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SA_PASSWORD
              value: "123+abc-456"  # Your SQL Server password
