apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: multi-container-service
spec:
  template:
    spec:
      containers:
        - name: angular-app
          image: gcr.io/projectmdanisulhaque/angular-app:latest  # Angular App
          resources:
            requests:
              cpu: "250m"  # 0.25 CPU for Angular
              memory: "512Mi"  # 512MB memory for Angular
            limits:
              cpu: "250m"  # 0.25 CPU for Angular
              memory: "512Mi"  # 512MB memory for Angular
          ports:
            - containerPort: 80  # Expose HTTP port for Angular

        # Internal container: Simple Billing, no external port
        - name: simplebilling
          image: gcr.io/projectmdanisulhaque/simplebilling:latest  # Simple Billing App
          resources:
            requests:
              cpu: "250m"  # 0.25 CPU for Simple Billing
              memory: "512Mi"  # 512MB memory for Simple Billing
            limits:
              cpu: "250m"  # 0.25 CPU for Simple Billing
              memory: "512Mi"  # 512MB memory for Simple Billing

        # Internal container: SQL Server, no external port
        - name: sqlserver
          image: gcr.io/projectmdanisulhaque/sqlserver:latest  # SQL Server
          resources:
            requests:
              cpu: "500m"  # 0.5 CPU for SQL Server
              memory: "2Gi"  # 2GB memory for SQL Server
            limits:
              cpu: "500m"  # 0.5 CPU for SQL Server
              memory: "2Gi"  # 2GB memory for SQL Server
          ports:
            - containerPort: 1433  # SQL Server default port
