apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: multi-container-service
spec:
  template:
    spec:
      containers:
        # Expose only Angular App with port 80 for HTTP traffic
        - image: gcr.io/projectmdanisulhaque/angular-app:latest
          ports:
            - containerPort: 80  # Expose HTTP port for Angular

        # SimpleBilling - no external port exposed
        - image: gcr.io/projectmdanisulhaque/simplebilling:latest
          # No containerPort exposed for SimpleBilling, internal communication only
          ports: []

        # SQL Server - no external port exposed
        - image: gcr.io/projectmdanisulhaque/sqlserver:latest
          # No containerPort exposed for SQL Server, internal communication only
          ports: []
