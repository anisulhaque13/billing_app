apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: multi-container-service
spec:
  template:
    spec:
      containers:
        - image: gcr.io/projectmdanisulhaque/angular-app:latest
          ports:
            - containerPort: 80
        - image: gcr.io/projectmdanisulhaque/simplebilling:latest
          ports:
            - containerPort: 8080
        - image: gcr.io/projectmdanisulhaque/sqlserver:latest
          ports:
            - containerPort: 1433
