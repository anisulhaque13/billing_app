apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angular-app
  template:
    metadata:
      labels:
        app: angular-app
    spec:
      containers:
        - name: angular-app
          image: gcr.io/projectmdanisulhaque/angular-app:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: angular-app-service
spec:
  type: LoadBalancer  # Change this to NodePort if you're not in a cloud environment
  selector:
    app: angular-app
  ports:
    - protocol: TCP
      port: 80        # External port
      targetPort: 80   # Internal container port
