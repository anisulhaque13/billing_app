version: '3.4'

services:
  angular-app:
    image: simplebilling.azurecr.io/angular-app:latest  # Use the image from Azure Container Registry
    ports:
      - "80:80"  # Expose Angular on port 80
    depends_on:
      - simplebilling  # Ensure the backend starts first
    restart: always  # Automatically restart if the container stops
    networks:
      - backend

  simplebilling:
    image: simplebilling.azurecr.io/simplebilling:latest  # Use the image from Azure Container Registry
    environment:
      - ASPNETCORE_URLS=https://+:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/https-dev-cert.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=121- 
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__BillingDB=Server=db;Database=BillingDB;User Id=sa;Password=123+abc-456;TrustServerCertificate=True
    ports:
      - "8080:8080"  # Map backend HTTPS port
    volumes:
      - ./https-dev-cert.pfx:/https/https-dev-cert.pfx:ro
    depends_on:
      - db  # Wait for the database service to start
    restart: always  # Automatically restart if the container stops
    networks:
      - backend

  db:
    image: simplebilling.azurecr.io/sql-server:latest  # Use the image from Azure Container Registry
    environment:
      - MSSQL_TCP_PORT=1433
      - ACCEPT_EULA=Y
      - SA_PASSWORD=123+abc-456
    ports:
      - "1433:1433"  # Map SQL Server port
    networks:
      - backend
    volumes:
      - mssql-data:/var/opt/mssql  # Persistent volume for database storage
    restart: always  # Automatically restart if the container stops
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 123+abc-456 -Q 'SELECT 1'"]
      interval: 10s  # Time between checks
      timeout: 10s   # Timeout for healthcheck
      retries: 5     # Retry count before marking the container as unhealthy

networks:
  backend:
    driver: bridge  # Use a bridge network for internal communication

volumes:
  mssql-data:
    driver: local  # Persistent volume for database storage
