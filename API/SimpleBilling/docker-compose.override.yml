version: "3.7"

services:
  simplebilling-app:
    build:
      context: ./UI/SimpleBilling.web
    image: gcr.io/projectmdanisulhaque/simplebilling-app:latest
    container_name: simplebilling-app
    ports:
      - "80:80"
    depends_on:
      - simplebilling
      - db
    networks:
      - backend
    volumes:
      - ./UI:/app/UI
      - ./API:/app/API

  simplebilling:
    image: gcr.io/projectmdanisulhaque/simplebilling:latest
    container_name: simplebilling
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__BillingDB=Server=db;Database=BillingDB;User Id=sa;Password=123+abc-456;TrustServerCertificate=True
    depends_on:
      - db
    networks:
      - backend

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=123+abc-456
    ports:
      - "1433:1433"
    networks:
      - backend
    volumes:
      - mssql-data:/var/opt/mssql

networks:
  backend:
    driver: bridge

volumes:
  mssql-data:
