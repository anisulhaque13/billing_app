version: '3.4'

services:

  angular-app:
    image: simplebilling.azurecr.io/angular-app:latest
    ports:
      - "80:80"
    environment:
      - API_URL=http://simplebilling/api  # Internal communication with the backend
    depends_on:
      - simplebilling
    restart: always

  simplebilling:
    image: simplebilling.azurecr.io/simplebilling:latest
    environment:
      - ASPNETCORE_URLS=http://+:80  # Backend listens on port 80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__BillingDB=Server=db;Database=BillingDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
    depends_on:
      - db
    restart: always

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}  # Use environment variable for password
      - MSSQL_TCP_PORT=1433
    restart: always
