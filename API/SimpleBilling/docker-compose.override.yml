version: '3.4'

services:
  angular-app:
    image: simplebilling.azurecr.io/angular-app:latest  # Use the image from Azure Container Registry
    depends_on:
      - simplebilling  # Ensure the backend starts first
    environment:
      - API_URL=http://simplebilling  # Internal communication with the backend
    ports:
      - "80:80" 
    networks:
      - backend
    restart: always

  simplebilling:
    image: simplebilling.azurecr.io/simplebilling:latest  # Use the image from Azure Container Registry
    environment:
      - ASPNETCORE_URLS=http://+:80  # Backend listens on port 80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__BillingDB=Server=db;Database=BillingDB;User Id=sa;Password=123+abc-456;TrustServerCertificate=True
    depends_on:
      - db  # Ensure the database service starts first
    networks:
      - backend
    restart: always

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest  # Use the latest official SQL Server image
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=123+abc-456
      - MSSQL_TCP_PORT=1433
    networks:
      - backend
    volumes:
      - mssql-data:/var/opt/mssql  # Persistent volume for database storage
    restart: always

networks:
  backend:
    driver: bridge  # Use a bridge network for internal communication

volumes:
  mssql-data:
    driver: local  # Persistent volume for database storage
