version: '3.4'

services:
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Mount the Nginx configuration file
    ports:
      - "80:80" # Expose Nginx on port 80
    depends_on:
      - angular-app
      - api
    networks:
      - backend

  angular-app:
    image: simplebilling.azurecr.io/angular-app:latest
    networks:
      - backend

  api:
    image: simplebilling.azurecr.io/simplebilling:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__BillingDB=Server=db;Database=BillingDB;User Id=sa;Password=123+abc-456;TrustServerCertificate=True
    depends_on:
      - db
    networks:
      - backend

  db:
    image: simplebilling.azurecr.io/sql-server:latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=123+abc-456
    networks:
      - backend
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "123+abc-456", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  backend:
    driver: bridge

volumes:
  mssql-data:
    driver: local
