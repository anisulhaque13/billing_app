name: CI/CD for Google Cloud

on:
  push:
    branches:
      - google-cloud  # Trigger workflow on push to the google-cloud branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Step 3: Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: ~/.cache/docker
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      # Step 4: Log in to Google Cloud using GitHub Secrets
      - name: Log in to Google Cloud
        uses: google-github-actions/auth@v0.5.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}  # Using the GCP service account key stored as a GitHub Secret

      # Step 5: Authenticate Docker to Google Artifact Registry using OAuth2 access token
      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://europe-west3-docker.pkg.dev

      # Step 6: Build and push Docker images to Google Artifact Registry
      - name: Build and push Docker images
        run: |
          # Build and tag the Angular app Docker image
          docker build -t europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/simplebilling-docker-repo/simplebilling-app:latest ./UI/SimpleBilling.web
          docker push europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/simplebilling-docker-repo/simplebilling-app:latest
          
          # Build and tag the .NET Backend Docker image
          docker build -t europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/simplebilling-docker-repo/simplebilling-backend:latest -f API/SimpleBilling/SimpleBilling ./API/SimpleBilling
          docker push europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/simplebilling-docker-repo/simplebilling-backend:latest
          
          # Pull the official SQL Server image from Docker Hub, tag, and push it to Artifact Registry
          docker pull mcr.microsoft.com/mssql/server:2022-latest
          docker tag mcr.microsoft.com/mssql/server:2022-latest europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/simplebilling-docker-repo/simplebilling-db:latest
          docker push europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/simplebilling-docker-repo/simplebilling-db:latest

      # Step 7: Set up Kubernetes credentials
      - name: Set up GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} --zone ${{ secrets.GKE_CLUSTER_ZONE }} --project ${{ secrets.GCP_PROJECT_ID }}

      # Step 8: Deploy to GKE
      - name: Deploy to Google Kubernetes Engine
        run: |
          kubectl apply -f k8s-deployment.yaml
          kubectl apply -f k8s-service.yaml

      # Step 9: Verify the deployment
      - name: Verify the deployment
        run: |
          kubectl get pods
