name: Deploy to Google Cloud

on:
  push:
    branches:
      - google-cloud  # Trigger the workflow on pushes to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code from GitHub
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Google Cloud credentials using service account key
      - name: Set up Google Cloud credentials
        uses: google-github-actions/setup-gcloud@v0.6.0
        with:
          project_id: projectmdanisulhaque
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Log in to Google Container Registry
      - name: Log in to Google Container Registry
        run: echo ${{ secrets.GCP_CREDENTIALS }} | docker login -u _json_key --password-stdin https://gcr.io

      # Build and push Docker images to Google Container Registry
      - name: Build and push Docker images
        run: |
          docker build -t gcr.io/projectmdanisulhaque/angular-app:latest -f UI/SimpleBilling.web/Dockerfile .
          docker build -t gcr.io/projectmdanisulhaque/simplebilling:latest -f backend/Dockerfile .
          docker build -t gcr.io/projectmdanisulhaque/db:latest -f db/Dockerfile .
          docker push gcr.io/projectmdanisulhaque/angular-app:latest
          docker push gcr.io/projectmdanisulhaque/simplebilling:latest
          docker push gcr.io/projectmdanisulhaque/db:latest

      # Set up Kubernetes configuration and deploy to GKE
      - name: Set up Kubernetes
        run: |
          gcloud container clusters get-credentials Status: PENDING	simplebilling-cluster --zone europe-west3 --project projectmdanisulhaque
          kubectl apply -f k8s/deployment.yaml
