name: CI/CD for Google Cloud

on:
  push:
    branches:
      - google-cloud  # Trigger workflow on push to the google-cloud branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Step 3: Cache Docker layers (this can be disabled to force a clean build)
      # Comment out the cache to prevent Docker from caching layers
      # - name: Cache Docker layers
      #   uses: actions/cache@v2
      #   with:
      #     path: ~/.cache/docker
      #     key: ${{ runner.os }}-docker-${{ github.sha }}
      #     restore-keys: |
      #       ${{ runner.os }}-docker-

      # Step 4: Log in to Google Cloud using GitHub Secrets
      - name: Log in to Google Cloud
        uses: google-github-actions/auth@v0.5.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}  # Using the GCP service account key stored as a GitHub Secret

      # Step 5: Authenticate Docker to Artifact Registry
      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://europe-west3-docker.pkg.dev

      # Step 6: Build and push Docker images to Google Artifact Registry
      - name: Build and push Docker images
        run: |
          # Build and tag the Angular app Docker image (force rebuild with --no-cache)
          docker build --no-cache -t europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/simplebilling-docker-repo/simplebilling-app:latest -f ./UI/SimpleBilling.web
          docker push europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/simplebilling-docker-repo/simplebilling-app:latest

          # Build and tag the .NET Backend Docker image (force rebuild with --no-cache)
          docker build --no-cache -t europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/simplebilling-docker-repo/simplebilling-backend:latest -f ./API/SimpleBilling/SimpleBilling
          docker push europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/simplebilling-docker-repo/simplebilling-backend:latest

          # Pull the official SQL Server image from Docker Hub, tag, and push it to Artifact Registry (force rebuild with --no-cache)
          docker pull mcr.microsoft.com/mssql/server:2022-latest
          docker tag mcr.microsoft.com/mssql/server:2022-latest europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/simplebilling-docker-repo/simplebilling-db:latest
          docker push europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/simplebilling-docker-repo/simplebilling-db:latest

      # Step 7: Set up Kubernetes credentials
      - name: Set up GKE credentials
        run: |
          sudo apt-get update
          sudo apt-get install -y google-cloud-cli
          # Manually add the Google Cloud SDK repository and install the plugin
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
          sudo apt-get update
          sudo apt-get install google-cloud-cli-gke-gcloud-auth-plugin
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} --zone ${{ secrets.GKE_CLUSTER_ZONE }} --project ${{ secrets.GCP_PROJECT_ID }}

      # Step 8: Deploy to Google Kubernetes Engine
      - name: Deploy to Google Kubernetes Engine
        run: |
          kubectl apply -f k8s/k8s-deployment.yaml
          kubectl apply -f k8s/k8s-service.yaml

      # Step 9: Verify the deployment
      - name: Verify the deployment
        run: |
          kubectl get pods
