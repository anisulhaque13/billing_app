name: Deploy to AWS ECS

on:
  push:
    branches:
      - aws  # Triggers the workflow when pushing to the 'aws' branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Configure AWS Credentials
    - name: Configure AWS CLI
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # Step 3: Login to Amazon ECR
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    # Step 4: Build, Tag, and Push Angular App Image
    - name: Build and Push Angular App Image
      run: |
        docker build -t angular-app ./UI/SimpleBilling.web
        docker tag angular-app:latest ${{ secrets.ECR_REPOSITORY_ANGULAR }}:latest
        docker push ${{ secrets.ECR_REPOSITORY_ANGULAR }}:latest

    # Step 5: Build, Tag, and Push Backend Image
    - name: Build and Push Backend Image
      run: |
        docker build -t simplebilling ./API/SimpleBilling/SimpleBilling
        docker tag simplebilling:latest ${{ secrets.ECR_REPOSITORY_SIMPLEBILLING }}:latest
        docker push ${{ secrets.ECR_REPOSITORY_SIMPLEBILLING }}:latest

    # Step 6: Build, Tag, and Push SQL Server Image (Optional)
    - name: Build and Push SQL Server Image
      run: |
        docker pull mcr.microsoft.com/mssql/server:2019-latest
        docker tag mcr.microsoft.com/mssql/server:2019-latest ${{ secrets.ECR_REPOSITORY_DB }}:latest
        docker push ${{ secrets.ECR_REPOSITORY_DB }}:latest

    # Step 7: Deploy to ECS
    - name: Deploy to Amazon ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        service: simplebilling-service  # Replace with your ECS service name
        cluster: simplebilling-cluster  # Replace with your ECS cluster name
        task-definition: task-definition.json
        wait-for-service-stability: true
