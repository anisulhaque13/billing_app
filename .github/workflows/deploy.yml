name: Deploy Multi-Container App to Cloud Run for Anthos

on:
  push:
    branches:
      - google-cloud

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Google Cloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Step 3: Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 4: Authenticate Docker to Google Cloud
      - name: Authenticate Docker to Google Cloud
        run: |
          gcloud auth configure-docker gcr.io

      # Step 5: Get GKE credentials
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} \
          --zone ${{ secrets.GKE_CLUSTER_ZONE }} \
          --project ${{ secrets.GCP_PROJECT_ID }}

      # Step 6: Install gke-gcloud-auth-plugin for kubectl
      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin

      # Step 7: Build and Push Angular App Docker Image
      - name: Build and Push Angular App Docker Image
        working-directory: ./UI/SimpleBilling.web  # Directory containing the Angular Dockerfile
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/angular-app:latest .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/angular-app:latest

      # Step 8: Build and Push Backend App Docker Image
      - name: Build and Push Backend App Docker Image
        working-directory: ./API/SimpleBilling/SimpleBilling  # Directory containing the Backend Dockerfile
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/simplebilling:latest . 
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/simplebilling:latest

      # Step 9: Build and Push SQL Server Docker Image
      - name: Build and Push SQL Server Docker Image
        run: |
          docker pull mcr.microsoft.com/mssql/server:2022-latest
          docker tag mcr.microsoft.com/mssql/server:2022-latest gcr.io/${{ secrets.GCP_PROJECT_ID }}/sqlserver:latest
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/sqlserver:latest

      # Step 10: Deploy to Cloud Run for Anthos
      - name: Deploy to Cloud Run for Anthos
        run: |
          kubectl apply -f k8s/multi-container-deployment.yaml
          kubectl apply -f k8s/multi-container-service.yaml

      # Step 11: Get Service URL
      - name: Get Service URL
        run: |
          kubectl get ksvc multi-container-service -o jsonpath='{.status.url}'
          echo "Service URL: $(kubectl get ksvc multi-container-service -o jsonpath='{.status.url}')"
