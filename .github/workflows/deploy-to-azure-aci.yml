name: Build and Deploy Multi-Container App to Azure

on:
  push:
    branches:
      - azure

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout Code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Login to Azure
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Step 3: Login to Azure Container Registry (ACR)
    - name: Login to ACR
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}

    # Step 4: Build and Push Angular App
    - name: Build and Push Angular App
      run: |
        docker build -t angular-app ./UI/SimpleBilling.web
        docker tag angular-app:latest ${{ secrets.ACR_NAME }}.azurecr.io/angular-app:latest
        docker push ${{ secrets.ACR_NAME }}.azurecr.io/angular-app:latest

    # Step 5: Build and Push Backend API
    - name: Build and Push Backend API
      run: |
        docker build -t simplebilling ./API/SimpleBilling/SimpleBilling
        docker tag simplebilling:latest ${{ secrets.ACR_NAME }}.azurecr.io/simplebilling:latest
        docker push ${{ secrets.ACR_NAME }}.azurecr.io/simplebilling:latest

    # Step 6: Pull and Push SQL Server Image
    - name: Pull and Push SQL Server
      run: |
        docker pull mcr.microsoft.com/mssql/server:2019-latest
        docker tag mcr.microsoft.com/mssql/server:2019-latest ${{ secrets.ACR_NAME }}.azurecr.io/sql-server:latest
        docker push ${{ secrets.ACR_NAME }}.azurecr.io/sql-server:latest

    # Step 7: Prepare Docker Compose Package
    - name: Prepare Docker Compose Package
      run: |
        zip docker-compose.zip ./API/SimpleBilling/docker-compose.yml

    # Step 8: Deploy to Azure App Service
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: simplebilling
        slot-name: Production
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./docker-compose.zip
