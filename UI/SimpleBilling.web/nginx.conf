events {
    worker_connections 1024;
}

http {


    server {
        listen 80;

        # Serve Angular static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;  # Redirect unmatched requests to index.html
        }



        # Custom health check endpoint
        location /health {
            return 200 "Healthy";
            add_header Content-Type text/plain;
        }
    }
}
