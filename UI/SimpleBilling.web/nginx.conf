# Define events block
events {
    worker_connections 1024;  # Define the maximum number of connections per worker
}

# Define http block
http {
    server {
        listen 80;
        server_name localhost;

        # Serve the Angular application
        location / {
            root /usr/share/nginx/html;  # Path to the Angular app's build directory
            index index.html;           # Entry point for the Angular app
            try_files $uri $uri/ /index.html;  # Handle SPA routing by redirecting to index.html
        }

        # Proxy API requests to the backend
        location /api {
            proxy_pass http://simplebilling:5001;  # Proxy to backend API service
            proxy_http_version 1.1;               # Use HTTP/1.1 for proper proxying
            proxy_set_header Upgrade $http_upgrade;  # Support WebSocket upgrades if necessary
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;          # Preserve the original Host header
            proxy_cache_bypass $http_upgrade;     # Disable caching for WebSocket connections
        }

        # Redirect 404 errors to index.html to handle client-side routing
        error_page 404 /index.html;
        location = /index.html {
            root /usr/share/nginx/html;  # Ensure it serves from the correct directory
        }

        # Additional caching headers (optional, for better performance)
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf)$ {
            expires 6M;                   # Cache static assets for six months
            access_log off;               # Disable logging for static assets
            add_header Cache-Control "public";
        }
    }
}
