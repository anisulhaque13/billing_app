server {
    listen 80;

    server_name simplebilling.azurewebsites.net;

    # Serve Angular frontend (static files)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;  # Handle routing for Angular SPA
    }

    # Proxy API requests to backend (simplebilling container)
    location /api/ {
        proxy_pass http://simplebilling;  # Forward API requests to backend using service name (no port needed)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Add more configurations if necessary (e.g., logging, error pages, etc.)
}
