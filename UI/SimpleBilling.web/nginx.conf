events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;

        # Serve Angular application
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;  # SPA fallback
        }

        # Proxy API requests to the backend container
        location /api {
            proxy_pass http://simplebilling;  # Use the container name and API port
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Handle SPA fallback for 404 errors
        error_page 404 /index.html;

        # Cache static assets for performance
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf)$ {
            expires 6M;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Enable Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;";

        # Health check endpoint
        location /health {
            return 200 'Healthy';
            add_header Content-Type text/plain;
        }

        # Logging (for Azure visibility)
        access_log /dev/stdout;
        error_log /dev/stderr warn;
    }
}
