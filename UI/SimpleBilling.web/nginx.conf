events {
    worker_connections 1024;  # Adjust the number of connections as needed
}

http {
    include       /etc/nginx/mime.types;  # Include MIME type definitions
    default_type  application/octet-stream;  # Set default MIME type

    server {
        listen 80;  # Default to port 80 if the PORT variable is not set

        server_name localhost;

        # Serve Angular application (SPA)
        location / {
            root /usr/share/nginx/html;  # Ensure Angular build files are copied here
            index index.html;  # Serve index.html by default
            try_files $uri /index.html;  # Fallback to index.html for Angular routing
        }

        # Handle API proxying for simplebilling (internal communication)
        location /api {
            proxy_pass http://simplebilling-service:8081;  # Forward API requests to simplebilling backend
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Cache static assets (e.g., images, CSS, JS) for better performance
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf)$ {
            root /usr/share/nginx/html;  # Serve static files from the Angular build directory
            expires 6M;  # Cache static assets for six months
            access_log off;  # Disable logging for static asset requests
            add_header Cache-Control "public, max-age=31536000, immutable";  # Cache indefinitely
        }

        # Enable Gzip compression for better performance
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_min_length 1024;  # Compress files larger than 1KB
        gzip_proxied any;
        gzip_comp_level 6;

        # Optional: Set timeouts and buffering settings for proxy requests
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
    }
}
