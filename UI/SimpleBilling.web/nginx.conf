events {
    worker_connections 1024;
}

http {
    upstream simplebilling_upstream {
        server simplebilling:80;
        keepalive 16;  # Maintain open connections to the backend
    }

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://simplebilling_upstream;
            proxy_connect_timeout 5s;  # Retry after 5 seconds if the backend is unavailable
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}

