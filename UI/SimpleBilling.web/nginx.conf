# Define events block
events {
    worker_connections 1024;  # Define the maximum number of connections per worker
}

# Define http block
http {
    server {
        listen 80;
        server_name localhost;

        # Serve the Angular application
        location / {
            root /usr/share/nginx/html;  # Root path to Angular's build files
            index index.html;
            try_files $uri /index.html;  # Redirect all requests to index.html
        }

        # Proxy API requests to the backend
        location /api/ {
            proxy_pass http://simplebilling-service:8080/;  # Use the backend service name and port
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle 404 errors by redirecting to Angular's index.html
        error_page 404 /index.html;

        # Cache static files for performance
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|otf|json|html)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }

        # Enable gzip compression for static files
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_proxied any;
    }
}
