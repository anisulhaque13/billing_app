server {
    listen 80;

    server_name localhost;

    # Serve Angular application
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;  # Make sure this is correct for Angular routing
    }

    # Handle API proxying for simplebilling (internal communication)
    location /api {
        proxy_pass http://simplebilling-service:8081;  # Forward API requests to simplebilling backend
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets for performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf)$ {
        root /usr/share/nginx/html;  # Matches the Angular build directory
        expires 6M;  # Cache static assets for six months
        access_log off;  # Disable logging for static asset requests
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Enable Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;

    # Optional: Set timeouts and buffering settings if necessary
    proxy_read_timeout 120s;
    proxy_connect_timeout 60s;
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;
}
