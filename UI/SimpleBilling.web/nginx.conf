# Define events block
events {
    worker_connections 1024;  # Define the maximum number of connections per worker
}

# Define http block
http {
    include       /etc/nginx/mime.types;  # Ensure MIME types are included
    default_type  application/octet-stream;  # Set a default MIME type

    server {
        listen 80;
        server_name simplebilling.azurewebsites.net;

        # Serve the Angular application
        location / {
            root /usr/share/nginx/html;  # Angular build output directory
            index index.html;  # Angular entry point
            try_files $uri $uri/ /index.html;  # Fallback to index.html for SPA routing
        }

        # Proxy API requests to the backend
        location /api/ {
            proxy_pass http://simplebilling:8080/;  # Backend API (http instead of https)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Optional: Cache static assets for performance
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf)$ {
            expires 6M;  # Cache static assets for six months
            access_log off;
            add_header Cache-Control "public";
        }

        # Handle 404 errors (SPA routing fallback to Angular's index.html)
        error_page 404 /index.html;
        location = /index.html {
            root /usr/share/nginx/html;  # Ensure it serves from Angular build directory
        }

        # Health check files
        location /robots1234.txt {
            return 200 "OK";
            add_header Content-Type text/plain;
            access_log off;
            log_not_found off;
        }
        location /robots933456.txt {
            return 200 "OK";
            add_header Content-Type text/plain;
            access_log off;
            log_not_found off;
        }

        # Security headers (optional)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self';" always;
    }
}
