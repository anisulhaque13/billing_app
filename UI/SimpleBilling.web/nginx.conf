events {
    worker_connections 1024;
}

http {
    upstream simplebilling_upstream {
        server simplebilling:80;  # Proxy to the backend service
    }

    server {
        listen 80;

        # Serve Angular static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;  # Redirect unmatched requests to index.html

            # Ensure proper MIME type for JavaScript files
            types {
                application/javascript js;
            }
        }

        # Proxy API requests to the backend
        location /api/ {
            proxy_pass http://simplebilling_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M;  # Increase body size limit for large payloads
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Custom health check endpoint
        location /health {
            return 200 "Healthy";
            add_header Content-Type text/plain;
        }
    }

}
