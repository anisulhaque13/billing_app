events {
    worker_connections 1024;  # Adjust the number of connections as needed
}

http {
    include       /etc/nginx/mime.types;  # Include MIME type definitions
    default_type  application/octet-stream;  # Set default MIME type

    server {
        listen 80;
        server_name _;

        # Serve Angular application
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;  # SPA fallback for Angular
        }

        # Handle API proxying (ensure correct API container name and port)
        location /api {
            proxy_pass http://simplebilling;  # Replace with your actual API container's name and port
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Cache static assets for performance
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf)$ {
            root /usr/share/nginx/html;  # Ensure the root matches your Angular build directory
            expires 6M;  # Cache static assets for six months
            access_log off;  # Disable logging for static asset requests
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Gzip compression for better performance
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
    }
}
