events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Serve Angular static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;  # Redirect all unmatched requests to index.html for Angular routing
        }

        # Proxy API requests to the backend
        location /api/ {
            proxy_pass http://simplebilling:80;  # Forward /api/* requests to the backend container
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optional: Logging and custom error pages can be added here
    }
}
