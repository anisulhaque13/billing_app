# Define events block
events {
    worker_connections 1024;  # Define the maximum number of connections per worker
}

# Define http block
http {
    server {
        listen 80;
        server_name localhost;

        # Serve the Angular application
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to the backend
        location /api {
            proxy_pass http://simplebilling:5001;  # Adjust the backend service name and port
        }

        error_page 404 /index.html;
    }
}
